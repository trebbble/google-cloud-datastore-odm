name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  quality:
      name: Lint with Ruff
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6
        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
        - name: Run Ruff
          run: uvx ruff check --output-format=github .

  test:
     name: Test & Coverage
     needs: quality
     runs-on: ubuntu-latest
     permissions:
       contents: write
     env:
        UV_PYTHON: "3.14"

     steps:
       - uses: actions/checkout@v6
       - name: Install uv
         uses: astral-sh/setup-uv@v7
         with:
           enable-cache: true

       - name: Install dependencies
         run: uv sync

       - name: Start Datastore Emulator
         run: |
           docker compose -f docker-compose.yml up -d datastore-test

       - name: Run tests with coverage
         env:
           DATASTORE_EMULATOR_HOST: localhost:10001
           GOOGLE_CLOUD_PROJECT: google-cloud-datastore-odm-test
         run: uv run pytest --cov=google_cloud_datastore_odm --cov-report=xml --cov-report=term-missing

       - name: Generate Coverage Badge
         if: github.event_name == 'push' && github.ref == 'refs/heads/main'
         run: uv run genbadge coverage -i coverage.xml -o coverage.svg

       - name: Commit Coverage Badge
         if: github.event_name == 'push' && github.ref == 'refs/heads/main'
         uses: stefanzweifel/git-auto-commit-action@v7
         with:
           commit_message: "chore: auto-update coverage badge [skip actions]"
           file_pattern: coverage.svg
